<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">

  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

  <style>
    /* 基础样式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #fff;
    }

    /* 导航栏 */
    nav {
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      display: inline-block;
      margin-right: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: 500;
      padding: 5px 10px;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #3498db;
    }

    /* 页面内容 */
    .page-content {
      min-height: calc(100vh - 200px);
    }

    /* 页脚 */
    footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
      color: #666;
      font-size: 0.9em;
      position: relative;
    }

    /* 标题样式 */
    h1, h2, h3, h4, h5, h6 {
      color: #2c3e50;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }

    h1 {
      font-size: 2em;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    h2 {
      font-size: 1.5em;
      color: #34495e;
    }

    /* 链接样式 */
    a {
      color: #3498db;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* 列表样式 */
    ul, ol {
      padding-left: 30px;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      nav ul li {
        display: block;
        margin: 5px 0;
      }
    }

    /* 高亮显示 */
    .highlight {
      background-color: #fff3cd;
      padding: 2px 5px;
      border-radius: 3px;
    }

    /* 时间线样式 */
    .timeline-item {
      margin-bottom: 30px;
      padding-left: 20px;
      border-left: 3px solid #3498db;
    }

    .timeline-item h3 {
      margin-top: 0;
      color: #2c3e50;
    }

    .timeline-item .meta {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 10px;
    }

    /* 项目列表样式 */
    .project-item {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 5px;
    }

    /* 社交链接图标 */
    .social-links a {
      margin-right: 15px;
      font-size: 0.9em;
    }

    /* 隐藏入口 - 秘密花园 */
    .secret-entrance {
      position: fixed;
      bottom: 15px;
      right: 15px;
      z-index: 9999;
      opacity: 0.03;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-size: 24px;
      color: #cbd5e1;
      text-decoration: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid transparent;
    }

    .secret-entrance:hover {
      opacity: 1;
      color: #00f0ff;
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      background: #050508;
      transform: scale(1.2) rotate(360deg);
    }

    .secret-entrance::after {
      content: '⬢';
      font-family: serif;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="{{ "/" | relative_url }}">Home</a></li>
      <li><a href="{{ "/cv/" | relative_url }}">CV</a></li>
      <li><a href="{{ "/research/" | relative_url }}">Research</a></li>
      <li><a href="{{ "/publications/" | relative_url }}">Publications</a></li>
      <li><a href="{{ "/contact/" | relative_url }}">Contact</a></li>
    </ul>
  </nav>

  <main class="page-content">
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ "now" | date: "%Y" }} {{ site.author.name }}. Last updated: {{ "now" | date: "%B %Y" }}.</p>
  </footer>

  <!-- 隐藏入口 - 秘密花园 (Nexus) -->
  <a href="{{ "/secret-garden/" | relative_url }}" class="secret-entrance" title="INITIATE_NEXUS"></a>
</body>
</html>
